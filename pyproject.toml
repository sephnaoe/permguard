[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "permguard"
version = "0.1.0"
description = "Declarative permission-shape engine: substring glob rules over whole command strings, last-match-wins, with order-aware drift detection."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "sephnaoe" }]
license = { text = "MIT" }
keywords = ["permissions", "guard", "glob", "drift", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.scripts]
permguard = "permguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["permguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
